[package]
name = "io"

# Pre-installed spin package: ships with the compiler, versioned with it.
# A pure native binding: no carried C -- IO::Buffer's implementation lives
# in the runtime (lib/sp_iobuffer.c), and io/buffer.rb binds it. The
# compiler splices `require "io/buffer"` into any program that references
# `IO::Buffer`, mirroring CRuby, where the class needs no require.
